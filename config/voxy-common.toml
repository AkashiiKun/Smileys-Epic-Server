#Voxy NeoForge — common config
#Field naming mirrors the legacy 'voxy_server_lod' companion mod for familiarity.
[server]
	#Maximum LOD level the server generates. Higher = more data pre-generated.
	#0 = LOD 0 only (finest). 4 = levels 0-4.
	# Default: 4
	# Range: 0 ~ 7
	max_lod_level = 4
	#How many chunks are voxelized per server tick. Lower = less CPU impact.
	# Default: 8
	# Range: 1 ~ 64
	voxelize_rate_per_tick = 8
	#Number of chunks delivered to each client per server tick.
	#Lower = less TPS impact but slower initial load.
	# Default: 4
	# Range: 1 ~ 64
	lod_chunks_per_tick = 4
	#Maximum LOD radius (in sections) the server will honour regardless of
	#what the client requests. Prevents overloading the server.
	# Default: 4096
	# Range: 1 ~ 8192
	lod_radius_max = 4096
	#If true, server pushes the manifest to each client on world-join.
	#If false, clients must request the manifest themselves.
	lod_send_on_join = true
	#How chunks NOT already on disk are handled when delivering to clients:
	#  DISK_ONLY (default) — silently skip; zero chunk generation.
	#  GENERATE            — generate them on demand. May cause TPS lag.
	#Allowed Values: DISK_ONLY, GENERATE
	lod_generation_mode = "GENERATE"
	#Maximum pending LOD section packets queued per connected client.
	#Reduces memory use when clients are on slow connections.
	# Default: 2048
	# Range: 64 ~ 65536
	max_transfer_queue_per_client = 2048

[client]
	#LOD render radius in sections (at LOD 0). Each section = 1 chunk.
	#The server clamps this to its lod_radius_max value.
	# Default: 256
	# Range: 8 ~ 8192
	lod_radius = 256
	#Display LOD sync progress in the HUD debug overlay.
	show_sync_hud = true
